<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDScript Academy</title>
<style>
:root{--bg:#0b0d12;--panel:#121722;--panel2:#171d29;--text:#f5f7fb;--muted:#9ba6b8;--accent:#7c5cff;--accent2:#22d3ee;--ok:#38d39f;--border:#283142}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button{font:inherit}.app{min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 20px}.top{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--accent2)}.progress{font-size:13px;color:var(--muted)}.bar{width:130px;height:7px;background:#252c39;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:22px;padding:22px 20px}.side{position:sticky;top:86px;height:calc(100vh - 110px);overflow:auto}.side h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.lesson{width:100%;text-align:left;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px;border-radius:12px;margin:5px 0;cursor:pointer}.lesson:hover,.lesson.active{border-color:var(--accent);background:var(--panel2)}.lesson small{display:block;color:var(--muted);margin-top:3px}.content{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;min-height:650px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#20263a;color:#bfc7ff;font-size:12px}.hero h1{font-size:34px;margin:12px 0 8px}.hero p{color:var(--muted);line-height:1.65}.card{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:18px;margin:18px 0}pre{background:#090b10;border:1px solid #222938;padding:16px;border-radius:12px;overflow:auto;line-height:1.55;position:relative}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.copy{float:right;border:1px solid var(--border);background:#151a24;color:#dce3ef;padding:5px 9px;border-radius:8px;cursor:pointer}.exercise{border-left:4px solid var(--accent2);padding-left:15px}.choices button{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:#111722;color:var(--text);cursor:pointer}.choices button:hover{border-color:var(--accent2)}.feedback{margin-top:10px;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav button{border:1px solid var(--border);background:#171d29;color:var(--text);padding:11px 15px;border-radius:10px;cursor:pointer}.nav .next{background:var(--accent);border-color:var(--accent)}.homegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.stat{padding:15px;border:1px solid var(--border);background:var(--panel2);border-radius:13px}.stat b{font-size:24px}.muted{color:var(--muted)}@media(max-width:780px){.layout{grid-template-columns:1fr;padding:12px}.side{position:static;height:auto;display:flex;overflow:auto;gap:6px}.side h3{display:none}.lesson{min-width:180px}.content{padding:20px}.hero h1{font-size:28px}.homegrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}@media(max-width:430px){.homegrid{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<header><div class="top"><div class="brand">GDScript <span>Academy</span></div><div class="progress">Progression <div class="bar"><div class="fill" id="fill"></div></div></div></div></header>
<div class="layout"><aside class="side" id="menu"><h3>Leçons</h3></aside><main class="content" id="content"></main></div></div>
<script>
const lessons=[
['var','Variables','Stocker une information',`var vie = 100\nvar niveau = 1\nvar nom = "Aventurier"`,'Crée argent = 500, force = 20 et nom = "Aventurier".'],
['if','Conditions','Prendre une décision',`var vie = 100\n\nif vie <= 0:\n    print("Game Over")`,'Affiche "Tu as gagné !" si niveau >= 10.'],
['else','Sinon','Faire autre chose si la condition est fausse',`if vie > 0:\n    print("Tu es vivant")\nelse:\n    print("Tu es mort")`,'Que va afficher le code si vie = 0 ?'],
['func','Fonctions','Créer une action réutilisable',`func dire_bonjour():\n    print("Bonjour !")\n\ndire_bonjour()`,'Crée une fonction attaquer() qui affiche "Attaque !".'],
['return','Return','Renvoyer une valeur',`func additionner(a, b):\n    return a + b\n\nvar resultat = additionner(5, 3)`,'Quelle valeur est renvoyée ?'],
['Input','Input','Détecter les commandes du joueur',`if Input.is_action_pressed("ui_right"):\n    print("Droite")`,'Quelle action utiliserais-tu pour la gauche ?'],
['velocity','Velocity','Gérer la vitesse',`velocity.x = 200\nmove_and_slide()`,'À quoi sert velocity ?'],
['extends','Extends','Définir ce que le script contrôle',`extends CharacterBody2D`,'Quel nœud est courant pour un personnage 2D ?'],
['@onready','Onready','Récupérer un nœud de la scène',`@onready var barre_vie = $BarreVie`,'Que récupère $BarreVie ?'],
['@export','Export','Modifier une valeur dans l’Inspecteur',`@export var vitesse = 200.0`,'Pourquoi utiliser @export ?'],
['for','For','Répéter une action un nombre de fois',`for i in range(5):\n    print("Coup !")`,'Combien de fois "Coup !" est-il affiché ?'],
['while','While','Répéter tant qu’une condition est vraie',`var vie = 3\nwhile vie > 0:\n    print(vie)\n    vie -= 1`,'Quand la boucle s’arrête-t-elle ?'],
['signal','Signal','Faire communiquer des éléments',`signal vie_changee\n\nvie_changee.emit()`,'Donne un exemple d’événement qui peut utiliser un signal.'],
['await','Await','Attendre un événement ou un délai',`await get_tree().create_timer(2.0).timeout\nprint("2 secondes sont passées")`,'Combien de secondes le code attend-il ?'],
['class','Classes','Créer des types réutilisables',`class_name Ennemi\n\nvar vie = 100\nvar force = 10\n\nfunc attaquer():\n    print("L'ennemi attaque !")`,'Donne un exemple de classe utile dans un jeu.']
];
let current=0;let done=JSON.parse(localStorage.getItem('gd_done')||'[]');
const menu=document.getElementById('menu');
lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='lesson';b.innerHTML=`${i+1}. <b>${l[0]}</b><small>${l[1]}</small>`;b.onclick=()=>show(i);menu.appendChild(b)});
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function show(i){current=i;let l=lessons[i];document.querySelectorAll('.lesson').forEach((b,n)=>b.classList.toggle('active',n===i));document.getElementById('content').innerHTML=`<section class="hero"><span class="tag">Leçon ${i+1} / 15</span><h1>${l[0]} — ${l[1]}</h1><p>${l[2]}. Apprends avec un exemple directement utilisable dans Godot.</p></section><div class="card"><h2>💻 Exemple</h2><pre><button class="copy" onclick="copyCode()">Copier</button><code id="code">${esc(l[3])}</code></pre></div><div class="card exercise"><h2>🎯 Exercice</h2><p>${l[4]}</p><div class="choices"><button onclick="mark()">J’ai compris cette leçon ✓</button></div><div class="feedback" id="feedback"></div></div><div class="homegrid"><div class="stat"><b>${i+1}</b><div class="muted">Leçon actuelle</div></div><div class="stat"><b>${done.length}</b><div class="muted">Leçons maîtrisées</div></div><div class="stat"><b>15</b><div class="muted">Objectif</div></div></div><div class="nav"><button ${i===0?'disabled':''} onclick="show(${i-1})">← Précédent</button><button class="next" ${i===14?'disabled':''} onclick="show(${i+1})">Suivant →</button></div>`;update()}
function mark(){if(!done.includes(current)){done.push(current);localStorage.setItem('gd_done',JSON.stringify(done))}document.getElementById('feedback').textContent='✅ Leçon validée ! Passe à la suivante quand tu es prêt.';update()}
function update(){document.getElementById('fill').style.width=(done.length/15*100)+'%'}
function copyCode(){navigator.clipboard?.writeText(lessons[current][3]);document.querySelector('.copy').textContent='Copié ✓';setTimeout(()=>document.querySelector('.copy').textContent='Copier',1000)}
show(0);
</script></body></html>
